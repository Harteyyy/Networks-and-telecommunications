<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <title>Вход - Сети и телекоммуникации</title>
</head>
<body>
    <!-- Хедер -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <img class="logo" src="img/logo.png" alt="Логотип">
            </a>
            
            <nav class="menu">
                <a class="menu-item" href="index.html">Главная</a>
                <a class="menu-item" href="about-course.html">О курсе</a>
                <a class="menu-item" href="contacts.html">Контакты</a>
                <a class="menu-item" href="reviews.html">Отзывы</a>
            </nav>
            
            <div class="header-actions">
                <a href="register.html" class="cabinet">
                    <img class="kabinet-icon" src="img/kabinet.png" alt="Личный кабинет">
                </a>
                <a href="Korzina.html" class="cart-link">
                    <img class="cart-icon" src="img/korzina.png" alt="Корзина">
                    <span class="cart-badge" id="header-cart-counter">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="register-section">
            <div class="register-container">
                <!-- Иконка сайта -->
                <img src="img/IconSite.svg" alt="Иконка сайта" class="register-icon">
                
                <!-- Заголовок -->
                <h1 class="register-title">ВХОД</h1>
                
                <!-- Форма входа -->
                <form class="register-form" id="loginForm">
                    <!-- Поле Email/Телефон -->
                    <div class="form-group">
                        <label class="input-label">Введите email или номер телефона</label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="login" 
                                name="login" 
                                class="form-input"
                                placeholder="Email или телефон"
                                required
                            >
                            <div class="error-plate" id="login-error">
                                <span class="error-text"></span>
                                <div class="error-arrow"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Поле Пароль -->
                    <div class="form-group">
                        <label class="input-label">Введите пароль</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input"
                                placeholder="Пароль"
                                required
                            >
                            <div class="error-plate" id="password-error">
                                <span class="error-text"></span>
                                <div class="error-arrow"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Кнопки -->
                    <div class="register-buttons">
                        <button type="submit" class="register-btn register-submit" id="login-submit-btn">Войти</button>
                        <a href="register.html" class="register-btn register-login">Регистрация</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Футер -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-top">
                <div class="footer-content">
                    <img src="img/logo.svg" alt="Логотип" class="footer-logo">
                    
                    <nav class="footer-nav">
                        <a href="index.html" class="footer-nav-link">Главная</a>
                        <a href="about-course.html" class="footer-nav-link">О курсе</a>
                        <a href="contacts.html" class="footer-nav-link">Контакты</a>
                        <a href="reviews.html" class="footer-nav-link">Отзывы</a>
                    </nav>
                    
                    <div class="footer-social">
                        <a href="#" class="social-link">
                            <img src="img/vk.svg" alt="ВКонтакте" class="social-icon">
                        </a>
                        <a href="#" class="social-link">
                            <img src="img/tg.svg" alt="Телеграм" class="social-icon">
                        </a>
                        <a href="#" class="social-link">
                            <img src="img/ot.svg" alt="Одноклассники" class="social-icon">
                        </a>
                        <a href="#" class="social-link">
                            <img src="img/yt.svg" alt="YouTube" class="social-icon">
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="footer-line"></div>
            
            <div class="footer-bottom">
                <div class="footer-bottom-content">
                    <div class="footer-copyright">
                        ©2025 Сети и телекоммуникации. Все права защищены.
                    </div>
                    
                    <div class="footer-policy">
                        <a href="#" class="policy-link">Политика конфиденциальности</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Обновляем счетчик корзины
            if (typeof updateAllCartCounters === 'function') {
                updateAllCartCounters();
            }
            
            // Проверяем, может пользователь уже авторизован
            if (typeof checkAuth === 'function' && checkAuth()) {
                window.location.href = 'profile.html';
                return;
            }
            
            // Функция определения типа введенных данных
            function getLoginType(value) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const phoneRegex = /^[\+]?[0-9\s\-\(\)]{10,20}$/;
                const cleanValue = value.replace(/\s|-|\(|\)/g, '');
                
                if (emailRegex.test(value)) return 'email';
                else if (phoneRegex.test(cleanValue)) return 'phone';
                else return 'unknown';
            }
            
            // Функция поиска пользователя
            function findUserByLogin(loginValue, passwordValue) {
                const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                const loginType = getLoginType(loginValue);
                
                if (loginType === 'email') {
                    return users.find(user => user.email === loginValue && user.password === passwordValue);
                } else if (loginType === 'phone') {
                    const cleanPhone = loginValue.replace(/\s|-|\(|\)/g, '');
                    return users.find(user => user.phone === cleanPhone && user.password === passwordValue);
                }
                return null;
            }
            
            // Функция отображения сообщения
            function showMessage(text, bgColor) {
                const message = document.createElement('div');
                message.style.cssText = `
                    position: fixed;
                    top: 100px;
                    left: 50%;
                    transform: translateX(-50%);
                    background-color: ${bgColor};
                    color: white;
                    padding: 15px 30px;
                    border-radius: 10px;
                    font-family: "Montserrat", sans-serif;
                    font-size: 16px;
                    z-index: 1000;
                    animation: slideDown 0.3s ease;
                `;
                message.textContent = text;
                document.body.appendChild(message);
                setTimeout(() => message.remove(), 3000);
            }
            
            const form = document.getElementById('loginForm');
            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('login-submit-btn');
            
            // Элементы для плашек с ошибками
            const loginErrorPlate = document.getElementById('login-error');
            const passwordErrorPlate = document.getElementById('password-error');
            const loginErrorText = loginErrorPlate.querySelector('.error-text');
            const passwordErrorText = passwordErrorPlate.querySelector('.error-text');
            
            function hideError(errorPlate) {
                if (errorPlate) errorPlate.classList.remove('show');
            }
            
            function showError(inputElement, errorPlate, errorTextElement, message) {
                if (!inputElement || !errorPlate || !errorTextElement) return;
                inputElement.classList.add('error');
                inputElement.classList.remove('success');
                errorTextElement.textContent = message;
                setTimeout(() => errorPlate.classList.add('show'), 10);
                setTimeout(() => hideError(errorPlate), 5000);
            }
            
            function showSuccess(inputElement, errorPlate) {
                if (!inputElement || !errorPlate) return;
                inputElement.classList.remove('error');
                inputElement.classList.add('success');
                hideError(errorPlate);
            }
            
            // Валидация логина
            function validateLogin() {
                const value = loginInput.value.trim();
                if (value === '') {
                    showError(loginInput, loginErrorPlate, loginErrorText, 'Пожалуйста, введите email или номер телефона');
                    return false;
                }
                const loginType = getLoginType(value);
                if (loginType === 'unknown') {
                    showError(loginInput, loginErrorPlate, loginErrorText, 'Введите корректный email или номер телефона');
                    return false;
                }
                showSuccess(loginInput, loginErrorPlate);
                return true;
            }
            
            // Валидация пароля
            function validatePassword() {
                const value = passwordInput.value.trim();
                if (value === '') {
                    showError(passwordInput, passwordErrorPlate, passwordErrorText, 'Пожалуйста, введите пароль');
                    return false;
                }
                showSuccess(passwordInput, passwordErrorPlate);
                return true;
            }
            
            function validateForm() {
                return validateLogin() && validatePassword();
            }
            
            // Обработчики событий
            if (loginInput) {
                loginInput.addEventListener('blur', validateLogin);
                loginInput.addEventListener('input', function() {
                    if (this.classList.contains('error')) validateLogin();
                });
                loginInput.addEventListener('focus', () => hideError(loginErrorPlate));
            }
            
            if (passwordInput) {
                passwordInput.addEventListener('blur', validatePassword);
                passwordInput.addEventListener('input', function() {
                    if (this.classList.contains('error')) validatePassword();
                });
                passwordInput.addEventListener('focus', () => hideError(passwordErrorPlate));
            }
            
            // Обработка отправки формы
            if (form && submitBtn) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    if (!validateForm()) return;
                    
                    const loginValue = loginInput.value.trim();
                    const passwordValue = passwordInput.value.trim();
                    
                    const existingUser = findUserByLogin(loginValue, passwordValue);
                    
                    if (!existingUser) {
                        showMessage('Неверный логин или пароль', '#ff4444');
                        return;
                    }
                    
                    // Вход выполнен — сохраняем данные пользователя
                    const userData = {
                        fullname: existingUser.fullname,
                        email: existingUser.email,
                        phone: existingUser.phone,
                        role: existingUser.role || 'user',
                        loggedInAt: new Date().toISOString()
                    };
                    
                    if (typeof login === 'function') {
                        login(userData);
                        showMessage('Вход выполнен успешно!', '#44ff44');
                    }
                    
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 1000);
                });
            }
        });
    </script>
    
    <style>
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
    </style>
</body>
</html>
